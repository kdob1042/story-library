<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__WORK_TITLE__ - 小説ビューア</title>
  <meta name="description" content="小説ビューア">
  <meta property="og:title" content="__WORK_TITLE__ - 小説ビューア">
  <meta property="og:description" content="小説ビューア">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    .font-mincho { font-family: 'Noto Serif JP', serif; }
    .font-gothic { font-family: 'Zen Kaku Gothic New', sans-serif; }
    .novel-body p {
      margin-bottom: 1.25rem;
      line-height: 2.1;
      text-indent: 1em;
      letter-spacing: 0.05em;
    }
    .novel-body p:has(strong), .novel-body h1, .novel-body h2, .novel-body h3 {
      text-indent: 0;
    }
    .novel-body hr {
      margin: 2.5rem 0;
      border: none;
      text-align: center;
    }
    .novel-body hr::after {
      content: "＊";
      color: #9ca3af;
      font-size: 1.25rem;
    }
    .novel-body figure {
      margin: 2rem 0;
    }
    .novel-body figure img {
      width: 100%;
      height: auto;
      border-radius: 0.75rem;
      box-shadow: 0 10px 25px rgba(28, 25, 23, 0.12);
    }
    .novel-body figcaption {
      margin-top: 0.75rem;
      color: #78716c;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 0.75rem;
      line-height: 1.6;
      text-align: center;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }

    :focus-visible { outline: 2px solid #047857; outline-offset: 3px; }
    #readerContainer:focus { outline: none; }
    #appBody { height: 100dvh; }
    #toggleReadingControlsBtn { display: inline-flex; }
    #headerActions { flex-direction: row; align-items: center; }
    #readingControls {
      display: none;
      position: absolute;
      top: calc(100% + 0.4rem);
      right: 0.75rem;
      z-index: 50;
      padding: 0.65rem;
      border: 1px solid #d6d3d1;
      border-radius: 0.75rem;
      background: #fafaf9;
      box-shadow: 0 12px 30px rgba(28, 25, 23, 0.18);
    }
    #readingControls.mobile-open { display: flex; }
    #readingControls button { min-width: 44px; min-height: 44px; }
    #readingControls button:disabled { opacity: 0.35; }
    #sidebar { width: min(20rem, calc(100vw - 3rem)); }
    #appBody[data-sidebar-open="true"] #sidebar { transform: translateX(0); }
    #appBody[data-sidebar-open="false"] #sidebar { display: none; }
    #sidebarBackdrop { position: absolute; inset: 0; z-index: 10; background: #0005; }
    #sidebarBackdrop[hidden] { display: none; }
    #episodesContainer summary::after { content: '＋'; }
    #episodesContainer details[open] > summary::after { content: '−'; }
    #appBody[data-theme="dark"] { color: #e7e5e4; background: #1c1917; }
    #appBody[data-theme="dark"] :is(#appHeader, #sidebar, #readingControls, #novelNavTitle, #workSelect) { color: #e7e5e4; background: #292524; border-color: #57534e; }
    #appBody[data-theme="dark"] :is(#novelContent, #articleTitle, #toggleSidebarBtn, #toggleReadingControlsBtn, #themeToggleBtn, #prevSceneBtn, .scene-nav-title) { color: #e7e5e4; }
    #appBody[data-theme="dark"] :is(#currentEpisodeTitle, #currentSceneTitle, #sceneProgressText, #sceneHeader > div, #workSwitcher label, #workSwitcherHint) { color: #a8a29e; }
    #appBody[data-theme="dark"] :is(#sceneHeader, #readerContainer nav) { border-color: #57534e; }
    #appBody[data-theme="dark"] #episodesContainer :is(details, summary, .scene-nav-item) { color: #e7e5e4; background: #292524; border-color: #57534e; }
    #appBody[data-theme="dark"] #episodesContainer .scene-nav-item[aria-current="page"] { background: #065f46; }
    #appBody[data-theme="dark"] :is(#readingControls, #appHeader, #sidebar) button:hover { background: #44403c; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }


    @media (max-width: 767px) {
      #appHeader {
        padding: 0.65rem 0.75rem;
        align-items: flex-start;
        gap: 0.5rem;
      }
      #workTitle {
        font-size: 0.875rem;
        line-height: 1.25rem;
        white-space: nowrap;
      }
      #headerMeta {
        margin-top: 0.125rem;
        min-width: 0;
      }
      #currentEpisodeTitle {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #currentSceneTitle {
        display: -webkit-box;
        max-width: none;
        margin-top: 0.2rem;
        overflow: hidden;
        white-space: normal;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        font-size: 0.8125rem;
        line-height: 1.25rem;
      }
      #sceneHeader { display: none; }
      #readerContainer { padding: 1.25rem; }
      .novel-body { font-size: 1.0625rem; }
      .novel-body p {
        margin-bottom: 1.4rem;
        line-height: 2;
        letter-spacing: 0.035em;
      }
    }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 font-mincho antialiased transition-colors duration-300 h-screen overflow-hidden flex flex-col" id="appBody">
  <!-- Top Navigation Bar -->
  <header id="appHeader" class="sticky top-0 z-30 shrink-0 bg-stone-100/90 backdrop-blur border-b border-stone-200 px-4 py-3 flex items-center justify-between shadow-xs">
    <div class="flex min-w-0 flex-1 items-start gap-2 sm:gap-3">
      <button id="toggleSidebarBtn" class="mt-0.5 shrink-0 p-2 rounded-lg hover:bg-stone-200 text-stone-700 transition" title="目次を開閉" aria-label="目次を開閉" aria-controls="sidebar" aria-expanded="false">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="min-w-0 flex-1 font-gothic">
        __MANGA_LINK__
        <h1 id="workTitle" class="sr-only">__WORK_TITLE__</h1>
        <div id="workSwitcher" class="mt-0 flex min-w-0 max-w-full items-center gap-2 font-gothic">
          <label for="workSelect" class="shrink-0 text-sm font-medium text-stone-500">作品</label>
          <select id="workSelect" class="min-w-0 max-w-full rounded-lg border border-stone-300 bg-white px-3 py-1.5 text-base font-semibold tracking-wide text-stone-900 shadow-sm outline-none transition focus:border-emerald-600 focus:ring-2 focus:ring-emerald-200 sm:text-xl" aria-label="作品を切り替え">
            <option value="">---</option>
          </select>
        </div>
        <p id="workSwitcherHint" class="mt-1 text-[11px] tracking-wide text-stone-400">More Coming</p>
        <div id="headerMeta" class="flex min-w-0 items-center gap-1.5 text-xs">
          <span id="currentSceneBadge" class="shrink-0 px-2 py-0.5 rounded-full bg-stone-200 text-stone-700 font-mono">---</span>
          <span id="currentEpisodeTitle" class="min-w-0 truncate text-stone-500"></span>
        </div>
        <p id="currentSceneTitle" class="mt-0.5 text-[13px] font-normal leading-5 text-stone-500 truncate"></p>
      </div>
    </div>

    <div id="headerActions" class="flex shrink-0 flex-col items-end gap-2">
      <button id="toggleReadingControlsBtn" class="items-center justify-center rounded-lg border border-stone-300 px-2.5 py-2 text-xs font-gothic text-stone-700 hover:bg-stone-200 transition" aria-expanded="false" aria-controls="readingControls" aria-label="表示設定" title="表示設定">
        Aa
      </button>
      <button id="nextHeaderBtn" class="inline-flex items-center justify-center rounded-lg bg-emerald-700 px-3 py-2 text-xs font-gothic text-white hover:bg-emerald-800 disabled:pointer-events-none disabled:opacity-30 transition whitespace-nowrap" aria-label="次のページ" disabled>
        次へ <span class="ml-1">&rarr;</span>
      </button>
    </div>

    <!-- Reading controls -->
    <div id="readingControls" role="group" aria-label="表示設定" class="reading-controls flex shrink-0 items-center gap-2">
      <button id="toggleFontBtn" class="px-2.5 py-1 text-xs rounded border border-stone-300 hover:bg-stone-200 font-gothic transition" title="フォント切り替え">
        明朝
      </button>
      <div class="flex items-center border border-stone-300 rounded overflow-hidden">
        <button id="fontSizeDown" class="px-2 py-1 text-xs hover:bg-stone-200 border-r border-stone-300" title="文字を小さく">A-</button>
        <button id="fontSizeUp" class="px-2 py-1 text-xs hover:bg-stone-200" title="文字を大きく">A+</button>
      </div>
      <button id="themeToggleBtn" class="p-2 rounded-lg hover:bg-stone-200 text-stone-700 transition" title="テーマ切り替え">
        <svg id="themeIconSun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
        <svg id="themeIconMoon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </div>
  </header>

  <div class="flex-1 min-h-0 flex overflow-hidden relative">
    <!-- Sidebar / Drawer -->
    <aside id="sidebar" class="w-80 h-full shrink-0 bg-stone-100 border-r border-stone-200 flex flex-col absolute inset-y-0 left-0 z-20 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-200 ease-in-out shadow-lg md:shadow-none">
      <div class="border-b border-stone-200 bg-stone-200/60 font-gothic text-xs">
        <div id="novelNavTitle" class="px-3 py-2.5 font-semibold text-stone-900 bg-stone-100">本文</div>
      </div>

      <!-- Novel Episodes List -->
      <div id="novelNav" class="flex-1 overflow-y-auto p-3 space-y-3 font-gothic text-sm">
        <div id="episodesContainer" class="space-y-3">
          <div class="text-stone-400 text-xs text-center py-4">目次を取得中...</div>
        </div>
      </div>

    </aside>

    <button id="sidebarBackdrop" type="button" aria-label="目次を閉じる" hidden></button>

    <!-- Main Content Reader Area -->
    <main class="flex-1 min-h-0 overflow-y-auto px-4 py-8 md:px-12 lg:px-24 flex justify-center" id="readerContainer" tabindex="-1" aria-label="小説本文">
      <article class="w-full max-w-3xl">
        <!-- Scene Title Header -->
        <header id="sceneHeader" class="mb-8 pb-4 border-b border-stone-200">
          <div class="flex items-center gap-2 text-xs font-gothic text-stone-500 mb-1">
            <span id="articleEpisode">-</span>
            <span>&bull;</span>
            <span id="articleSceneId">-</span>
          </div>
          <h2 id="articleTitle" class="text-2xl font-bold tracking-wider text-stone-900 font-gothic"></h2>
        </header>

        <!-- Main Novel Content -->
        <div id="novelContent" aria-busy="true" class="novel-body text-base text-stone-800 leading-relaxed font-mincho">
          <p class="text-center text-stone-400 py-12 font-gothic">本文を読み込んでいます...</p>
        </div>

        <!-- Navigation Buttons at the bottom of the scene -->
        <nav class="mt-12 pt-6 border-t border-stone-200 flex items-center justify-between font-gothic text-xs">
          <button id="prevSceneBtn" class="px-4 py-2 rounded-lg border border-stone-300 hover:bg-stone-200 text-stone-700 disabled:opacity-30 disabled:pointer-events-none transition flex items-center gap-1.5">
            <span>&larr;</span> 前のページ
          </button>
          <span id="sceneProgressText" class="text-stone-500">-</span>
          <button id="nextSceneBtn" class="px-4 py-2 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white disabled:opacity-30 disabled:pointer-events-none transition flex items-center gap-1.5">
            次のページ <span>&rarr;</span>
          </button>
        </nav>

        __EMAIL_SUBSCRIBE__
      </article>
    </main>
  </div>

  <script>
    let libraryData = null;
    let manifestData = null;
    let currentWork = null;
    let currentWorkBase = '';
    let loadToken = 0;
    let allScenes = [];
    let currentSceneIndex = 0;
    let currentTheme = 'sepia'; // 'sepia' or 'dark'
    let currentFont = 'mincho'; // 'mincho' or 'gothic'
    let currentFontSize = 16;

    const appBody = document.getElementById('appBody');
    const sidebar = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const toggleReadingControlsBtn = document.getElementById('toggleReadingControlsBtn');
    const readingControls = document.getElementById('readingControls');
    const toggleFontBtn = document.getElementById('toggleFontBtn');
    const fontSizeUp = document.getElementById('fontSizeUp');
    const fontSizeDown = document.getElementById('fontSizeDown');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIconSun = document.getElementById('themeIconSun');
    const themeIconMoon = document.getElementById('themeIconMoon');
    const workTitle = document.getElementById('workTitle');
    const mangaLink = document.getElementById('mangaLink');
    const workSelect = document.getElementById('workSelect');

    const novelNavTitle = document.getElementById('novelNavTitle');
    const novelNav = document.getElementById('novelNav');
    const episodesContainer = document.getElementById('episodesContainer');

    const articleEpisode = document.getElementById('articleEpisode');
    const articleSceneId = document.getElementById('articleSceneId');
    const articleTitle = document.getElementById('articleTitle');
    const headerMeta = document.getElementById('headerMeta');
    const sceneHeader = document.getElementById('sceneHeader');
    const currentSceneTitle = document.getElementById('currentSceneTitle');
    const currentEpisodeTitle = document.getElementById('currentEpisodeTitle');
    const currentSceneBadge = document.getElementById('currentSceneBadge');
    const novelContent = document.getElementById('novelContent');
    const prevSceneBtn = document.getElementById('prevSceneBtn');
    const nextSceneBtn = document.getElementById('nextSceneBtn');
    const sceneProgressText = document.getElementById('sceneProgressText');
    const sceneNavigation = prevSceneBtn.closest('nav');
    const nextHeaderBtn = document.getElementById('nextHeaderBtn');
    const emailSubscribeForm = document.getElementById('emailSubscribeForm');
    const emailWorkSelect = document.getElementById('emailWorkSelect');
    const emailSubscribeAddress = document.getElementById('emailSubscribeAddress');
    const emailSubscribeStatus = document.getElementById('emailSubscribeStatus');

    const readerContainer = document.getElementById('readerContainer');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');
    let sceneLoadToken = 0;
    let activeNav = null;
    const sceneCache = new Map();
    const lastSceneByWork = new Map();
    const preferenceKey = 'story-library-reading';

    function setSidebar(open) {
      appBody.dataset.sidebarOpen = String(open);
      toggleSidebarBtn.setAttribute('aria-expanded', String(open));
      sidebar.inert = !open;
      sidebarBackdrop.hidden = !open || window.innerWidth >= 768;
    }

    function setReadingControls(open, {restoreFocus = false} = {}) {
      readingControls.classList.toggle('mobile-open', open);
      toggleReadingControlsBtn.setAttribute('aria-expanded', String(open));
      if (open) toggleFontBtn.focus();
      else if (restoreFocus) toggleReadingControlsBtn.focus();
    }

    toggleSidebarBtn.addEventListener('click', () => {
      setSidebar(appBody.dataset.sidebarOpen !== 'true');
      setReadingControls(false);
    });
    sidebarBackdrop.addEventListener('click', () => setSidebar(false));
    toggleReadingControlsBtn.addEventListener('click', () => {
      setReadingControls(!readingControls.classList.contains('mobile-open'));
    });
    document.addEventListener('click', event => {
      if (!readingControls.contains(event.target) && !toggleReadingControlsBtn.contains(event.target)) {
        setReadingControls(false);
      }
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (readingControls.classList.contains('mobile-open')) setReadingControls(false, {restoreFocus: true});
        if (appBody.dataset.sidebarOpen === 'true' && window.innerWidth < 768) {
          setSidebar(false);
          toggleSidebarBtn.focus();
        }
        return;
      }
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.defaultPrevented) return;
      if (event.target.closest('input, textarea, select, button, summary, a, [contenteditable="true"]')) return;
      if (event.key === 'ArrowRight' && !nextSceneBtn.disabled) {
        event.preventDefault();
        goToNextScene();
      } else if (event.key === 'ArrowLeft' && !prevSceneBtn.disabled) {
        event.preventDefault();
        loadScene(currentSceneIndex - 1);
      }
    });
    let desktopSidebar = window.innerWidth >= 768;
    setSidebar(desktopSidebar);
    window.addEventListener('resize', () => {
      const desktop = window.innerWidth >= 768;
      if (desktop !== desktopSidebar) {
        desktopSidebar = desktop;
        setSidebar(desktop);
        setReadingControls(false);
      }
    });

    function applyReadingPreferences({save = true} = {}) {
      appBody.dataset.theme = currentTheme;
      toggleFontBtn.textContent = currentFont === 'mincho' ? '明朝' : 'ゴシック';
      novelContent.classList.toggle('font-mincho', currentFont === 'mincho');
      novelContent.classList.toggle('font-gothic', currentFont === 'gothic');
      novelContent.style.fontSize = `${currentFontSize}px`;
      fontSizeDown.disabled = currentFontSize <= 14;
      fontSizeUp.disabled = currentFontSize >= 24;
      themeIconMoon.classList.toggle('hidden', currentTheme === 'dark');
      themeIconSun.classList.toggle('hidden', currentTheme !== 'dark');
      themeToggleBtn.setAttribute('aria-label', currentTheme === 'dark' ? '明るい表示にする' : '暗い表示にする');
      if (save) {
        try { localStorage.setItem(preferenceKey, JSON.stringify({font: currentFont, fontSize: currentFontSize, theme: currentTheme})); }
        catch { /* Reading remains available when storage is disabled. */ }
      }
    }
    try {
      const saved = JSON.parse(localStorage.getItem(preferenceKey));
      if (saved?.font === 'gothic') currentFont = 'gothic';
      if (saved?.theme === 'dark') currentTheme = 'dark';
      if (Number.isInteger(saved?.fontSize) && saved.fontSize >= 14 && saved.fontSize <= 24) currentFontSize = saved.fontSize;
    } catch { /* Invalid or unavailable preferences use the defaults. */ }
    applyReadingPreferences({save: false});
    toggleFontBtn.addEventListener('click', () => {
      currentFont = currentFont === 'mincho' ? 'gothic' : 'mincho';
      applyReadingPreferences();
    });
    fontSizeUp.addEventListener('click', () => {
      currentFontSize = Math.min(24, currentFontSize + 2);
      applyReadingPreferences();
    });
    fontSizeDown.addEventListener('click', () => {
      currentFontSize = Math.max(14, currentFontSize - 2);
      applyReadingPreferences();
    });
    themeToggleBtn.addEventListener('click', () => {
      currentTheme = currentTheme === 'dark' ? 'sepia' : 'dark';
      applyReadingPreferences();
    });

    function showLoadError(message, retry) {
      novelContent.setAttribute('aria-busy', 'false');
      novelContent.innerHTML = '';
      const note = document.createElement('p');
      note.className = 'text-rose-500 text-center py-8';
      note.setAttribute('role', 'alert');
      note.textContent = message;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'block mx-auto rounded-lg border border-stone-300 px-4 py-2 font-gothic text-sm';
      button.textContent = '再読み込み';
      button.addEventListener('click', () => { button.disabled = true; retry(); });
      novelContent.append(note, button);
    }

    // Retain only recently visited scenes in memory; never persist manuscript text.
    function fetchSceneText(url) {
      if (sceneCache.has(url)) {
        const cached = sceneCache.get(url);
        sceneCache.delete(url);
        sceneCache.set(url, cached);
        return cached;
      }
      const request = fetchText([url]).catch(error => {
        if (sceneCache.get(url) === request) sceneCache.delete(url);
        throw error;
      });
      sceneCache.set(url, request);
      if (sceneCache.size > 20) sceneCache.delete(sceneCache.keys().next().value);
      return request;
    }

    // Fetch only files included in the current reader snapshot.
    async function fetchText(paths) {
      let lastErr = null;
      for (const url of paths) {
        try {
          const res = await fetch(url);
          if (!res.ok) {
            lastErr = new Error(`HTTP ${res.status} for ${url}`);
            continue;
          }
          return await res.text();
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('fetch failed');
    }

    function showReaderShell() {
      headerMeta.classList.remove('hidden');
      currentSceneTitle.classList.remove('hidden');
      sceneHeader.classList.remove('hidden');
      sceneNavigation.classList.remove('hidden');
    }

    function showReaderState(message, {error = false, selectorLabel = message} = {}) {
      currentWork = null;
      currentWorkBase = '';
      manifestData = null;
      allScenes = [];
      currentSceneIndex = 0;
      novelContent.setAttribute('aria-busy', 'false');

      workTitle.textContent = '小説ライブラリ';
      document.title = '小説ライブラリ - 小説ビューア';
      workSelect.innerHTML = `<option value="">${escapeHtml(selectorLabel)}</option>`;
      workSelect.disabled = true;
      mangaLink.classList.add('hidden');

      headerMeta.classList.add('hidden');
      currentSceneTitle.classList.add('hidden');
      sceneHeader.classList.add('hidden');
      sceneNavigation.classList.add('hidden');

      currentSceneBadge.textContent = '---';
      currentEpisodeTitle.textContent = '';
      articleEpisode.textContent = '-';
      articleSceneId.textContent = '-';
      articleTitle.textContent = '';
      sceneProgressText.textContent = '-';
      prevSceneBtn.disabled = true;
      nextSceneBtn.disabled = true;
      nextHeaderBtn.disabled = true;

      novelNavTitle.textContent = '本文';
      episodesContainer.innerHTML = '';
      const note = document.createElement('div');
      note.className = `${error ? 'text-rose-500' : 'text-stone-500'} text-xs text-center py-4`;
      note.textContent = message;
      episodesContainer.appendChild(note);

      novelContent.innerHTML = '';
      const messageNode = document.createElement('p');
      messageNode.className = `${error ? 'text-rose-500' : 'text-stone-500'} text-center py-8`;
      messageNode.textContent = message;
      novelContent.appendChild(messageNode);
    }

    async function loadLibrary() {
      try {
        libraryData = JSON.parse(await fetchText(['data/library-index.json']));
        if (!Array.isArray(libraryData.works)) throw new Error('Invalid library index');
        if (libraryData.works.length === 0) {
          showReaderState('現在公開中の作品はありません。', {selectorLabel: '公開作品なし'});
          return;
        }
        renderWorkSelector();
        const requested = new URL(window.location.href).searchParams.get('work');
        const initial = libraryData.works.some(work => work.id === requested)
          ? requested
          : libraryData.defaultWorkId || libraryData.works[0].id;
        await selectWork(initial, {updateUrl: false});
      } catch (err) {
        console.error('Failed to load library:', err);
        showReaderState('作品一覧の取得に失敗しました。', {error: true, selectorLabel: '読み込み失敗'});
        showLoadError('作品一覧を取得できませんでした。', loadLibrary);
      }
    }

    function renderWorkSelector() {
      workSelect.innerHTML = '';
      libraryData.works.forEach(work => {
        const option = document.createElement('option');
        option.value = work.id;
        option.textContent = work.title;
        workSelect.appendChild(option);
      });
      workSelect.disabled = libraryData.works.length < 2;
      syncEmailWorkSelector();
    }

    function syncEmailWorkSelector() {
      if (!emailWorkSelect || !libraryData) return;
      const previous = emailWorkSelect.value;
      emailWorkSelect.innerHTML = '';
      libraryData.works.forEach(work => {
        const option = document.createElement('option');
        option.value = work.id;
        option.textContent = work.title;
        emailWorkSelect.appendChild(option);
      });
      const preferred = currentWork?.id || previous || libraryData.defaultWorkId || libraryData.works[0]?.id || '';
      emailWorkSelect.value = preferred;
    }

    function routeSceneIndex() {
      const params = new URL(window.location.href).searchParams;
      const sceneId = params.get('scene');
      const episodeId = params.get('episode');
      if (sceneId) {
        const sceneIndex = allScenes.findIndex(scene => scene.id === sceneId);
        if (sceneIndex >= 0) return sceneIndex;
      }
      if (episodeId) {
        const episodeIndex = allScenes.findIndex(scene => scene.episodeId === episodeId);
        if (episodeIndex >= 0) return episodeIndex;
      }
      return 0;
    }

    async function selectWork(workId, {updateUrl = true} = {}) {
      if (!libraryData) return;
      const work = libraryData.works.find(item => item.id === workId);
      if (!work) return;
      showReaderShell();
      const token = ++loadToken;
      ++sceneLoadToken;
      activeNav = null;
      currentWork = work;
      currentWorkBase = `/${String(work.basePath || '').replace(/^\/+/, '')}/data/`;
      workSelect.value = work.id;
      syncEmailWorkSelector();
      workTitle.textContent = work.title;
      document.title = `${work.title} - 小説ビューア`;
      mangaLink.classList.toggle('hidden', !work.mangaUrl);
      if (work.mangaUrl) {
        mangaLink.href = work.mangaUrl;
        mangaLink.textContent = '漫画版を読む ↗';
      } else {
        mangaLink.removeAttribute('href');
        mangaLink.textContent = '';
      }

      manifestData = null;
      allScenes = [];
      currentSceneIndex = 0;
      prevSceneBtn.disabled = true;
      nextSceneBtn.disabled = true;
      nextHeaderBtn.disabled = true;
      episodesContainer.innerHTML = '<div class="text-stone-400 text-xs text-center py-4">目次を取得中...</div>';
      novelContent.setAttribute('aria-busy', 'true');
      novelContent.innerHTML = '<p class="text-stone-400 text-center py-8">作品を読み込んでいます...</p>';
      currentEpisodeTitle.textContent = '読み込み中...';
      currentSceneTitle.textContent = '読み込み中...';
      currentSceneBadge.textContent = '---';
      articleTitle.textContent = '読み込み中...';
      document.getElementById('readerContainer').scrollTop = 0;

      try {
        const text = await fetchText(contentUrls('reader-index.json'));
        if (token !== loadToken) return;
        manifestData = JSON.parse(text);
        if (!Array.isArray(manifestData.episodes) || !Array.isArray(manifestData.scenes)) throw new Error('Invalid reader index');
        renderTableOfContents();
        if (allScenes.length > 0) {
          const rememberedIndex = allScenes.findIndex(scene => scene.id === lastSceneByWork.get(work.id));
          const initialIndex = updateUrl ? Math.max(0, rememberedIndex) : routeSceneIndex();
          await loadScene(initialIndex, {token, historyMode: updateUrl ? 'push' : 'replace'});
        } else {
          updateSceneUrl(null, updateUrl ? 'push' : 'replace');
          novelContent.setAttribute('aria-busy', 'false');
          currentEpisodeTitle.textContent = '';
          currentSceneTitle.textContent = '';
          articleTitle.textContent = '';
          novelContent.innerHTML = '<p class="text-stone-500 text-center py-8">本文がありません。</p>';
        }
      } catch (err) {
        if (token !== loadToken) return;
        console.error('Failed to load manifest:', err);
        episodesContainer.textContent = '目次を取得できませんでした。';
        showLoadError('目次を取得できませんでした。', () => selectWork(work.id, {updateUrl}));
      }
    }

    workSelect.addEventListener('change', () => selectWork(workSelect.value));

    if (emailSubscribeForm) {
      emailSubscribeForm.addEventListener('submit', async event => {
        event.preventDefault();
        const email = emailSubscribeAddress.value.trim();
        const workId = emailWorkSelect?.value || currentWork?.id || '';
        emailSubscribeStatus.textContent = '確認メールを送信しています...';
        const submitButton = emailSubscribeForm.querySelector('button[type="submit"]');
        if (submitButton) submitButton.disabled = true;
        try {
          const response = await fetch('/api/email/subscribe', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, workId, format: 'novel'}),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            if (response.status === 429) throw new Error('少し時間を置いてから再度お試しください。');
            if (response.status === 503) throw new Error('現在、登録受付の準備中です。');
            throw new Error('入力内容を確認して、もう一度お試しください。');
          }
          emailSubscribeStatus.textContent = payload.message || '確認メールを送信しました。メールから登録を確定してください。';
          emailSubscribeAddress.value = '';
        } catch (error) {
          emailSubscribeStatus.textContent = error instanceof Error ? error.message : '登録に失敗しました。';
        } finally {
          if (submitButton) submitButton.disabled = false;
        }
      });
    }

    window.addEventListener('popstate', () => {
      if (!libraryData?.works.length) return;
      const requested = new URL(window.location.href).searchParams.get('work');
      const workId = libraryData.works.some(work => work.id === requested)
        ? requested
        : libraryData.defaultWorkId || libraryData.works[0].id;
      if (currentWork?.id === workId && allScenes.length) {
        loadScene(routeSceneIndex(), {historyMode: 'replace'});
      } else {
        selectWork(workId, {updateUrl: false});
      }
    });

    function contentUrls(relPath) {
      const cleaned = String(relPath || '').replace(/^\/+/, '');
      return currentWorkBase ? [`${currentWorkBase}${cleaned}`] : [];
    }

    function renderTableOfContents() {
      episodesContainer.innerHTML = '';
      allScenes = [];
      const sections = Array.isArray(manifestData.sections) && manifestData.sections.length > 0
        ? manifestData.sections
        : manifestData.episodes.map(episode => ({
            id: episode.id,
            title: episode.title,
            scene_ids: episode.scene_ids || [],
          }));
      novelNavTitle.textContent = `本文 (全${manifestData.episodes.length}話)`;
      const sceneById = {};
      manifestData.scenes.forEach(s => { sceneById[s.id] = s; });

      sections.forEach((section, sectionIdx) => {
        const epWrapper = document.createElement('details');
        epWrapper.className = 'border border-stone-200 rounded-lg overflow-hidden bg-white/70';

        const epHeader = document.createElement('summary');
        epHeader.className = 'px-3 py-2 bg-stone-100/70 border-b border-stone-200 font-semibold text-xs text-stone-800 flex items-center justify-between cursor-pointer hover:bg-stone-200/70 transition gap-2';
        epHeader.innerHTML = `<span>${escapeHtml(section.title)}</span><span class="text-[10px] text-stone-400">${section.scene_ids.length} 場面</span>`;

        const sceneList = document.createElement('div');
        sceneList.className = 'divide-y divide-stone-100';

        section.scene_ids.forEach(sid => {
          const scene = sceneById[sid];
          if (!scene) return;
          const globalIdx = allScenes.length;
          allScenes.push({
            ...scene,
            episodeTitle: section.title,
            episodeIdx: sectionIdx,
            globalIndex: globalIdx
          });

          const item = document.createElement('button');
          item.className = `scene-nav-item w-full text-left px-3 py-2 hover:bg-emerald-50 transition text-xs flex items-center justify-between text-stone-700`;
          item.id = `nav-scene-${sid}`;
          item.innerHTML = `
            <span class="min-w-0 pr-2">
              <span class="block text-[10px] text-stone-400 font-mono">${escapeHtml(scene.displayId || sid)}</span>
              <span class="scene-nav-title block truncate text-stone-700">${escapeHtml(scene.title || sid)}</span>
            </span>
          `;
          item.addEventListener('click', () => {
            loadScene(globalIdx);
            if (window.innerWidth < 768) {
              setSidebar(false);
              readerContainer.focus({preventScroll: true});
            }
          });
          sceneList.appendChild(item);
        });

        epWrapper.appendChild(epHeader);
        epWrapper.appendChild(sceneList);
        episodesContainer.appendChild(epWrapper);
      });
    }

    function updateSceneUrl(sceneId, historyMode) {
      const url = new URL(window.location.href);
      url.searchParams.set('work', currentWork.id);
      if (sceneId) url.searchParams.set('scene', sceneId);
      else url.searchParams.delete('scene');
      url.searchParams.delete('episode');
      if (url.href !== window.location.href) window.history[historyMode + 'State']({}, '', url);
    }

    async function loadScene(index, {token = loadToken, historyMode = 'push'} = {}) {
      if (token !== loadToken || index < 0 || index >= allScenes.length) return;
      const sceneToken = ++sceneLoadToken;
      currentSceneIndex = index;
      const scene = allScenes[index];
      updateSceneUrl(scene.id, historyMode);
      lastSceneByWork.set(currentWork.id, scene.id);
      currentSceneTitle.textContent = scene.title || scene.id;
      articleTitle.textContent = scene.title || scene.id;
      const workAtLoad = currentWork;

      // Update UI Header
      const episodeName = String(scene.episodeTitle || '')
        .replace(/^第\d+話(?:［[^］]+］)?/, '')
        .trim();
      currentEpisodeTitle.textContent = episodeName;
      const sceneDisplayId = scene.displayId || scene.id;
      currentSceneBadge.textContent = sceneDisplayId;
      articleEpisode.textContent = scene.episodeTitle;
      articleSceneId.textContent = sceneDisplayId;
      sceneProgressText.textContent = `${index + 1} / ${allScenes.length}`;

      prevSceneBtn.disabled = index === 0;
      nextSceneBtn.disabled = index === allScenes.length - 1;
      nextHeaderBtn.disabled = index === allScenes.length - 1;

      if (activeNav) {
        activeNav.classList.remove('bg-emerald-100', 'text-emerald-900', 'font-semibold');
        activeNav.removeAttribute('aria-current');
      }
      activeNav = document.getElementById(`nav-scene-${scene.id}`);
      if (activeNav) {
        activeNav.classList.add('bg-emerald-100', 'text-emerald-900', 'font-semibold');
        activeNav.setAttribute('aria-current', 'page');
        activeNav.closest('details').open = true;
      }

      novelContent.setAttribute('aria-busy', 'true');
      novelContent.innerHTML = '<p class="text-stone-400 text-center py-8">場面を読み込み中...</p>';
      document.getElementById('readerContainer').scrollTop = 0;

      try {
        const text = await fetchSceneText(contentUrls(scene.path)[0]);
        if (token !== loadToken || sceneToken !== sceneLoadToken || workAtLoad !== currentWork) return;
        renderMarkdownScene(text, scene.id, scene.path);
        novelContent.setAttribute('aria-busy', 'false');
      } catch (err) {
        if (token !== loadToken || sceneToken !== sceneLoadToken || workAtLoad !== currentWork) return;
        console.error('Failed to load scene file:', err);
        showLoadError('本文を取得できませんでした。', () => loadScene(index, {historyMode: 'replace'}));
      }
    }

    function renderMarkdownScene(markdown, sceneId, markdownPath) {
      const lines = markdown.split('\n');
      let title = sceneId;
      let bodyLines = [];

      lines.forEach(line => {
        if (line.startsWith('#')) {
          title = line.replace(/^#+\s*/, '').replace(/^［.*?］/, '').trim();
        } else {
          bodyLines.push(line);
        }
      });

      articleTitle.textContent = title;
      currentSceneTitle.textContent = title;

      // Group into paragraphs
      let html = '';
      let pBuffer = [];

      for (let i = 0; i < bodyLines.length; i++) {
        const line = bodyLines[i].trim();
        const imageMatch = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
        if (imageMatch) {
          if (pBuffer.length > 0) {
            html += `<p>${pBuffer.join('<br>')}</p>`;
            pBuffer = [];
          }
          const imageUrl = resolveMarkdownAssetUrl(markdownPath, imageMatch[2]);
          const alt = escapeHtml(imageMatch[1]);
          html += `<figure><img src="${escapeHtml(imageUrl)}" alt="${alt}" loading="lazy" decoding="async">${alt ? `<figcaption>${alt}</figcaption>` : ''}</figure>`;
        } else if (line === '＊' || line === '***' || line === '---') {
          if (pBuffer.length > 0) {
            html += `<p>${pBuffer.join('<br>')}</p>`;
            pBuffer = [];
          }
          html += '<hr>';
        } else if (line === '') {
          if (pBuffer.length > 0) {
            html += `<p>${pBuffer.join('<br>')}</p>`;
            pBuffer = [];
          }
        } else {
          pBuffer.push(escapeHtml(line));
        }
      }
      if (pBuffer.length > 0) {
        html += `<p>${pBuffer.join('<br>')}</p>`;
      }

      novelContent.innerHTML = html;
    }

    function resolveMarkdownAssetUrl(markdownPath, imagePath) {
      const raw = String(imagePath || '').trim();
      if (/^(https?:|data:)/i.test(raw)) return raw;

      const parts = String(markdownPath || '').split('/');
      parts.pop();
      raw.split('/').forEach(part => {
        if (!part || part === '.') return;
        if (part === '..') {
          parts.pop();
        } else {
          parts.push(part);
        }
      });
      return `${currentWorkBase}${parts.filter(Boolean).join('/')}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    prevSceneBtn.addEventListener('click', () => {
      if (currentSceneIndex > 0) loadScene(currentSceneIndex - 1);
    });

    function goToNextScene() {
      if (currentSceneIndex < allScenes.length - 1) loadScene(currentSceneIndex + 1);
    }

    nextSceneBtn.addEventListener('click', goToNextScene);
    nextHeaderBtn.addEventListener('click', goToNextScene);

    loadLibrary();
  </script>
</body>
</html>
